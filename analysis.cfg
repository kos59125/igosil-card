# KataGo analysis エンジン用の最小設定 (server.py から使用)
# 詳細は KataGo 同梱の analysis_example.cfg を参照してください。

logDir = analysis_logs
logToStderr = false

# 勝率は黒視点で返させ、サーバー側で白視点に変換する (server.py でも上書き指定している)
reportAnalysisWinratesAs = BLACK

# 1 局面あたりの既定探索数 (クエリ側の maxVisits が優先される)
maxVisits = 100

# 複数局面を並列に解析する数。最適化では大量の局面を投げるので大きめが有利
numAnalysisThreads = 8
numSearchThreadsPerAnalysisThread = 2

# GPU を使う場合はバッチを大きく
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
